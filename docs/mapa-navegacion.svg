<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Mapa de navegación de Pádel Mar Azul</title>
  <desc id="descripcion">Siete páginas conectadas por un flujo de reserva y una cabecera y pie comunes.</desc>
  <defs>
    <marker id="flecha" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#23551e"/>
    </marker>
    <style>
      .fondo{fill:#f8fafc}.nodo{fill:#fff;stroke:#23551e;stroke-width:3;rx:18}
      .comun{fill:#e8f4e6;stroke:#23551e;stroke-width:3;rx:18}
      .linea{fill:none;stroke:#23551e;stroke-width:3;marker-end:url(#flecha)}
      .legal{fill:none;stroke:#64748b;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#flecha)}
      .titulo{font:700 30px system-ui;fill:#0f172a}.sub{font:18px system-ui;fill:#334155}
      .etiqueta{font:700 17px system-ui;fill:#23551e}.nota{font:16px system-ui;fill:#475569}
    </style>
  </defs>
  <rect class="fondo" width="1600" height="1120"/>
  <text x="800" y="55" text-anchor="middle" class="titulo">Mapa de navegación · Pádel Mar Azul</text>
  <rect class="comun" x="470" y="95" width="660" height="115"/>
  <text x="800" y="140" text-anchor="middle" class="titulo">Cabecera y pie · presentes en las 7 páginas</text>
  <text x="800" y="177" text-anchor="middle" class="sub">Menú: Turnos · Mis turnos · Normas | Pie: Aviso legal · Privacidad · Normas</text>

  <rect class="nodo" x="80" y="340" width="300" height="125"/>
  <text x="230" y="390" text-anchor="middle" class="titulo">Turnos</text>
  <text x="230" y="425" text-anchor="middle" class="sub">index.html</text>

  <rect class="nodo" x="470" y="340" width="300" height="125"/>
  <text x="620" y="390" text-anchor="middle" class="titulo">Confirmar reserva</text>
  <text x="620" y="425" text-anchor="middle" class="sub">reserva.html</text>

  <rect class="nodo" x="860" y="340" width="300" height="125"/>
  <text x="1010" y="390" text-anchor="middle" class="titulo">Justificante</text>
  <text x="1010" y="425" text-anchor="middle" class="sub">justificante.html</text>

  <rect class="nodo" x="1250" y="340" width="280" height="125"/>
  <text x="1390" y="390" text-anchor="middle" class="titulo">Mis turnos</text>
  <text x="1390" y="425" text-anchor="middle" class="sub">mis-turnos.html</text>

  <path class="linea" d="M380 402 H460"/>
  <text class="etiqueta" x="420" y="385" text-anchor="middle">Continuar</text>
  <path class="linea" d="M770 402 H850"/>
  <text class="etiqueta" x="810" y="385" text-anchor="middle">Confirmar</text>
  <path class="linea" d="M1160 402 H1240"/>
  <text class="etiqueta" x="1200" y="385" text-anchor="middle">Ver mis turnos</text>

  <rect class="nodo" x="150" y="700" width="350" height="125"/>
  <text x="325" y="750" text-anchor="middle" class="titulo">Normas de uso</text>
  <text x="325" y="785" text-anchor="middle" class="sub">normas.html</text>

  <rect class="nodo" x="625" y="700" width="350" height="125"/>
  <text x="800" y="750" text-anchor="middle" class="titulo">Aviso legal</text>
  <text x="800" y="785" text-anchor="middle" class="sub">aviso-legal.html</text>

  <rect class="nodo" x="1100" y="700" width="350" height="125"/>
  <text x="1275" y="750" text-anchor="middle" class="titulo">Privacidad</text>
  <text x="1275" y="785" text-anchor="middle" class="sub">privacidad.html</text>

  <path class="legal" d="M800 210 V270 H230 V330"/>
  <path class="legal" d="M800 210 V285 H620 V330"/>
  <path class="legal" d="M800 210 V300 H1010 V330"/>
  <path class="legal" d="M800 210 V315 H1390 V330"/>
  <path class="legal" d="M800 210 V600 H325 V690"/>
  <path class="legal" d="M800 210 V625 H800 V690"/>
  <path class="legal" d="M800 210 V650 H1275 V690"/>

  <path class="linea" d="M230 465 V570 H325 V690"/>
  <text class="etiqueta" x="245" y="555">Enlace a normas</text>
  <path class="linea" d="M620 465 V590 H325 V690"/>
  <text class="etiqueta" x="500" y="580">Aceptar normas</text>

  <text x="800" y="930" text-anchor="middle" class="nota">Flechas continuas: flujo de tarea y enlaces internos.</text>
  <text x="800" y="960" text-anchor="middle" class="nota">Flechas discontinuas: acceso compartido desde la cabecera y el pie de todas las páginas.</text>
  <text x="800" y="1010" text-anchor="middle" class="sub">Desde cualquier página se puede volver a Turnos, Mis turnos o Normas mediante el menú.</text>
</svg>
